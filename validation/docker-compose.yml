version: "3.8"

networks:
    meet.jitsi:
        name: meet.jitsi.validation

services:
    web:
        image: mowsen/jitsi-meet:latest
        container_name: jitsi-web-validation
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            - PUBLIC_URL=http://localhost:8080
        networks:
            - meet.jitsi
        depends_on:
            - prosody

    prosody:
        image: jitsi/prosody:stable-9584
        container_name: jitsi-prosody-validation
        restart: unless-stopped
        ports:
            - "5281:5280"
        environment:
            - ENABLE_AUTH=0
            - ENABLE_GUESTS=1
            - XMPP_DOMAIN=meet.jitsi
            - XMPP_AUTH_DOMAIN=auth.meet.jitsi
            - XMPP_MUC_DOMAIN=muc.meet.jitsi
            - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
            - JICOFO_AUTH_USER=focus
            - JICOFO_AUTH_PASSWORD=jicofopass
            - JVB_AUTH_USER=jvb
            - JVB_AUTH_PASSWORD=jvbpass
        networks:
            - meet.jitsi

    jicofo:
        image: jitsi/jicofo:stable-9584
        container_name: jitsi-jicofo-validation
        restart: unless-stopped
        depends_on:
            - prosody
        environment:
            - ENABLE_AUTH=0
            - XMPP_DOMAIN=meet.jitsi
            - XMPP_AUTH_DOMAIN=auth.meet.jitsi
            - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
            - XMPP_SERVER=prosody
            - JICOFO_AUTH_USER=focus
            - JICOFO_AUTH_PASSWORD=jicofopass
            - JVB_BREWERY_MUC=jvbbrewery
        networks:
            - meet.jitsi

    jvb:
        image: jitsi/jvb:stable-9584
        container_name: jitsi-jvb-validation
        restart: unless-stopped
        depends_on:
            - prosody
        ports:
            - "10001:10000/udp"
        environment:
            - XMPP_AUTH_DOMAIN=auth.meet.jitsi
            - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
            - XMPP_SERVER=prosody
            - JVB_AUTH_USER=jvb
            - JVB_AUTH_PASSWORD=jvbpass
            - JVB_BREWERY_MUC=jvbbrewery
            - JVB_PORT=10000
            - JVB_STUN_SERVERS=stun.l.google.com:19302
        networks:
            - meet.jitsi

version: "3.8"

services:
    jitsi-meet:
        build: .
        ports:
            - "8080:80"
        environment:
            - NODE_ENV=production
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

